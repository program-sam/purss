# Behind an existing HTTPS reverse proxy (e.g. Nginx Proxy Manager) on a shared Docker network,
# with no host ports. Point the proxy at http://purss-workspace:8940 and set in .env:
#   PURSS_PUBLIC_ORIGIN=https://purss.example.com   (the exact address people open)
#   PURSS_PROXY_NETWORK=nginx_default                   (the proxy's network)
#   docker compose -f infra/compose.yaml -f infra/compose.proxy.yaml up -d --build
services:
  api:
    ports: !reset []
    environment:
      PURSS_PUBLIC_ORIGIN: ${PURSS_PUBLIC_ORIGIN:?set PURSS_PUBLIC_ORIGIN to the https address}
      PURSS_TRUST_PROXY: "1"
    networks:
      proxy: { aliases: [purss-workspace] }

networks:
  proxy:
    external: true
    name: ${PURSS_PROXY_NETWORK:-nginx_default}
